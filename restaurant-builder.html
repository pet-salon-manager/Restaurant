<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>全国飲食店マスタ作成ツール</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f7f4ec;color:#3d342a;margin:0;padding:18px}
.wrap{max-width:720px;margin:auto}.card{background:#fff;border:1px solid #e5ddcf;border-radius:16px;padding:16px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
h1{font-size:22px;margin:0 0 8px}.note{font-size:13px;line-height:1.6;color:#6d6256}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{background:#f3eee4;border-radius:12px;padding:10px;text-align:center}.n{font-weight:900;font-size:20px}.l{font-size:11px;color:#776b5e}
button{width:100%;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:800;margin-top:10px}#start{background:#2f6f4e;color:#fff}.save{background:#e9f3ed;color:#245c40}.save:disabled{opacity:.45}.bar{height:10px;background:#e8e2d8;border-radius:999px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;width:0;background:#2f6f4e}.log{white-space:pre-wrap;background:#2d2d2d;color:#eee;border-radius:10px;padding:10px;font:12px/1.5 ui-monospace,monospace;max-height:260px;overflow:auto;margin-top:12px}.warn{color:#9a4e2c}
</style>
</head><body><div class="wrap"><div class="card">
<h1>🍴 全国飲食店マスタ作成ツール</h1>
<div class="note">OpenStreetMap / Overpass から、店名と住所が登録されているレストラン・カフェ・ファストフードを都道府県ごとに取得します。取得はこの作成ツールでだけ行い、公開アプリは保存済みJSONを表示するだけです。</div>
<div class="stats"><div class="stat"><div class="n" id="pref">0/47</div><div class="l">都道府県</div></div><div class="stat"><div class="n" id="count">0</div><div class="l">住所付き飲食店</div></div><div class="stat"><div class="n" id="req">0</div><div class="l">APIリクエスト</div></div></div>
<div class="bar"><i id="bar"></i></div>
<button id="start">▶ 全国取得を開始</button>
<button class="save" id="save1" disabled>⬇ restaurants-1.json を保存</button>
<button class="save" id="save2" disabled>⬇ restaurants-2.json を保存</button>
<div class="note warn">取得には時間がかかります。Safariを閉じたり画面をロックしないでください。Overpassが混雑している場合は自動で待って再試行します。</div>
<div class="log" id="log">待機中</div>
</div></div>
<script>
const prefs=Array.from({length:47},(_,i)=>`JP-${String(i+1).padStart(2,'0')}`);
let all=[],requests=0,running=false;
const $=id=>document.getElementById(id); const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function log(s){$('log').textContent+=`\n${s}`;$('log').scrollTop=$('log').scrollHeight}
function addr(t={}){if(t['addr:full'])return String(t['addr:full']).trim();const p=[t['addr:postcode'],t['addr:province']||t['addr:prefecture'],t['addr:city'],t['addr:suburb'],t['addr:quarter'],t['addr:neighbourhood'],t['addr:street'],t['addr:block_number'],t['addr:housenumber']].filter(Boolean).map(v=>String(v).trim());return [...new Set(p)].join(' ')}
async function fetchPref(code,attempt=1){
 const q=`[out:json][timeout:90];area["ISO3166-2"="${code}"][boundary=administrative]->.a;(nwr(area.a)["amenity"~"^(restaurant|cafe|fast_food)$"]["name"];);out center tags;`;
 requests++;$('req').textContent=requests;
 try{
   const r=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:'data='+encodeURIComponent(q)});
   if(!r.ok)throw new Error(`HTTP ${r.status}`);return await r.json();
 }catch(e){if(attempt<4){log(`${code}: ${e.message} → ${attempt*8}秒後に再試行`);await sleep(attempt*8000);return fetchPref(code,attempt+1)}throw e}
}
function normalize(data){const out=[];for(const el of (data.elements||[])){const t=el.tags||{};const address=addr(t);if(!address)continue;const lat=Number(el.lat??el.center?.lat),lon=Number(el.lon??el.center?.lon);if(!Number.isFinite(lat)||!Number.isFinite(lon))continue;out.push({id:`${el.type}/${el.id}`,name:t.name||'飲食店',type:t.amenity||'restaurant',address,openingHours:t.opening_hours||'',phone:t.phone||t['contact:phone']||'',website:t.website||t['contact:website']||'',lat,lon})}return out}
function save(name,data){const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('start').onclick=async()=>{if(running)return;running=true;all=[];requests=0;$('log').textContent='取得開始';$('start').disabled=true;
 try{for(let i=0;i<prefs.length;i++){const code=prefs[i];log(`${code} を取得中…`);const d=await fetchPref(code);const rows=normalize(d);all.push(...rows);const m=new Map(all.map(x=>[x.id,x]));all=[...m.values()];$('pref').textContent=`${i+1}/47`;$('count').textContent=all.length.toLocaleString('ja-JP');$('bar').style.width=`${((i+1)/47)*100}%`;log(`${code}: ${rows.length}件 / 合計 ${all.length}件`);await sleep(1300)}
  log('完了');$('save1').disabled=false;$('save2').disabled=false;
 }catch(e){log('エラー: '+e.message)}finally{$('start').disabled=false;running=false}}
$('save1').onclick=()=>{const m=Math.ceil(all.length/2);save('restaurants-1.json',all.slice(0,m))};
$('save2').onclick=()=>{const m=Math.ceil(all.length/2);save('restaurants-2.json',all.slice(m))};
</script></body></html>
